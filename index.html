<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 12 Project</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <h1>Do you know Gillian?</h1>
    <hr />
    <!-- Music Question -->
    <form id="music-form">
      <label>
        🎵 Which is my favorite band or artist?
        <select id="music-answer">
          <option value="music1">Bob Dylan</option>
          <option value="music2">Electric Light Orchestra</option>
          <option value="music3">The Beatles</option>
          <option value="music4">Fleetwood Mac</option>
        </select>
      </label>
      <button type="submit">Check Music Answer</button>
    </form>
    <div id="music-result">
      <p id="music-text"></p>
    </div>
    <hr />
    <!-- beatle Question -->
    <form id="beatle-form">
      <label>
        🎸 Who is my favorite BEATLE?
        <select id="beatle-answer">
          <option value="beatle1">John Lennon</option>
          <option value="beatle2">Paul McCartney</option>
          <option value="beatle3">George Harrison</option>
          <option value="beatle4">Ringo Starr</option>
        </select>
      </label>
      <button type="submit">Check Beatle Answer</button>
    </form>
    <div id="beatle-result">
      <p id="beatle-text"></p>
    </div>

<!-- Sport Question -->
    <form id="sport-form">
      <label>
        💪 Which activity do I do?
        <select id="sport-answer">
          <option value="sport1">Weight Lifting</option>
          <option value="sport2">Fencing</option>
          <option value="sport3">Gymnastics</option>
          <option value="sport4">Horseback Riding</option>
        </select>
      </label>
      <button type="submit">Check Activity Answer</button>
    </form>
    <div id="sport-result">
      <p id="sport-text"></p>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
      
      $("#beatle-form").hide();
      $("#beatle-result").hide();

      //========================music Question jQuery Code
      $("#music-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#music-answer");
        var answer = $answer.val();

        if (answer === "music3") {
          $("#music-text").text("YESSSS!");
          $("#beatle-form").show();
          $("#beatle-result").show();
        } 
        else {
          $("#music-text").text("Try Again!");
        }
      });

      //=======================Beatle Question jQuery Code
      $("#beatle-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#beatle-answer");
        var answer = $answer.val();

        if (answer === "beatle2") {
          $("#beatle-text").text("YESSSS!");
        } 
        else {
          $("#beatle-text").text("Try Again!");
        }
      });

       //=======================Sport Question jQuery Code
      $("#sport-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#sport-answer");
        var answer = $answer.val();

        if (answer === "sport4") {
          $("#sport-text").text("YESSSS!");
        } 
        else {
          $("#sport-text").text("Try Again!");
        }

    
      });
      
    </script>
  </body>

  <!--- Taken From Khan Academy HTML/JS: Making webpages interactive with jQuery-->
</html>
